<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./tokens.css">
<style>
.gridwrap{container-type:inline-size}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
@container (min-width:520px){.grid2{grid-template-columns:repeat(3,1fr)}}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scrollx{overflow-x:auto;scrollbar-width:none}.scrollx::-webkit-scrollbar{display:none}
</style>
</helmet>

<div ref="{{ rootRef }}" dir="rtl" lang="ar" class="tier-public" style="min-height:100vh;display:flex;justify-content:center">
<div style="width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--paper-public);border-inline:1px solid var(--rule)">

<header style="position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--rule)">
<div style="display:flex;align-items:center;gap:10px;padding:12px 16px 9px"><span style="font-size:var(--t-h2);font-weight:600;flex:1">{{ t.title }}</span>
<div role="group" aria-label="{{ t.langLabel }}" style="display:flex;border:1px solid var(--rule-strong);border-radius:var(--r-sm);overflow:hidden;flex:none">
<sc-for list="{{ langs }}" as="l" hint-placeholder-count="3">
<button type="button" onClick="{{ l.pick }}" aria-pressed="{{ l.on }}" style="height:24px;padding:0 8px;border:0;background:{{ l.bg }};color:{{ l.fg }};font-size:var(--t-micro);font-weight:500;cursor:pointer">{{ l.short }}</button>
</sc-for>
</div></div>
<nav aria-label="{{ t.kind }}" style="display:grid;grid-template-columns:repeat(3,1fr)">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{ t.pick }}" aria-current="{{ t.on }}" style="height:41px;border:0;border-bottom:2px solid {{ t.bd }};background:transparent;color:{{ t.fg }};font-size:var(--t-sm);font-weight:{{ t.fw }};cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px">
{{ t.label }}<span class="num" style="font-size:var(--t-micro);color:var(--ink-3)"><bdi>{{ t.n }}</bdi></span>
</button>
</sc-for>
</nav>
</header>

<main style="flex:1;padding:15px 16px 26px">

<!-- ══ PRODUCTS ══ -->
<sc-if value="{{ isProd }}" hint-placeholder-val="{{ true }}">
<div class="gridwrap"><div class="grid2">
<sc-for list="{{ products }}" as="p" hint-placeholder-count="4">
<article class="card" style="overflow:hidden;display:flex;flex-direction:column;opacity:{{ p.op }}">
<div style="position:relative">
<span class="img img-card ph {{ p.ph }}" style="border-radius:0;display:block"></span>
<button type="button" aria-label="{{ t.unsave }}" style="position:absolute;inset-block-start:8px;inset-inline-end:8px;width:31px;height:31px;border:0;border-radius:50%;background:oklch(1 0 0 / 0.9);display:grid;place-items:center;cursor:pointer;box-shadow:var(--e1)">
<svg width="15" height="15" viewBox="0 0 24 24" fill="var(--brand)" stroke="var(--brand)" stroke-width="1.9"><path d="M12 20s-7-4.4-7-9.3A4.2 4.2 0 0 1 12 8a4.2 4.2 0 0 1 7 2.7c0 4.9-7 9.3-7 9.3z"/></svg>
</button>
<sc-if value="{{ p.gone }}" hint-placeholder-val="{{ false }}">
<span style="position:absolute;inset:0;background:oklch(1 0 0 / 0.62);display:grid;place-items:center">
<span class="chip chip-neutral" style="background:var(--surface)">{{ p.goneLabel }}</span>
</span>
</sc-if>
</div>
<div style="padding:10px 11px 12px;display:flex;flex-direction:column;gap:6px;flex:1">
<h3 class="clamp2" style="margin:0;font-size:var(--t-sm);font-weight:400;line-height:1.45;min-height:37px">{{ p.title }}</h3>
<div style="display:flex;align-items:baseline;gap:6px">
<span class="num" style="font-size:16px;font-weight:600;color:{{ p.priceFg }}"><bdi>{{ p.price }}</bdi></span>
<sc-if value="{{ p.dropped }}" hint-placeholder-val="{{ false }}">
<span class="num" style="font-size:var(--t-micro);color:var(--ink-3);text-decoration:line-through"><bdi>{{ p.was }}</bdi></span>
</sc-if>
</div>
<sc-if value="{{ p.hasNote }}" hint-placeholder-val="{{ false }}">
<div style="font-size:var(--t-micro);color:{{ p.noteFg }};line-height:1.5">{{ p.note }}</div>
</sc-if>
<div style="font-size:var(--t-micro);color:var(--ink-2);padding-top:6px;border-top:1px solid var(--rule-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ p.seller }}</div>
</div>
</article>
</sc-for>
</div></div>
</sc-if>

<!-- ══ SELLERS / IMPORTERS ══ -->
<sc-if value="{{ isPeople }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:11px">
<sc-for list="{{ people }}" as="p" hint-placeholder-count="3">
<article class="card" style="padding:13px;display:flex;align-items:center;gap:12px">
<span aria-hidden="true" style="flex:none;width:44px;height:44px;border-radius:50%;background:{{ p.avBg }};display:grid;place-items:center;font-size:12px;font-weight:600;color:{{ p.avFg }}">{{ p.initials }}</span>
<div style="flex:1;min-width:0">
<div style="display:flex;align-items:center;gap:6px">
<span style="font-size:var(--t-h3);font-weight:500">{{ p.name }}</span>
<svg width="13" height="13" viewBox="0 0 24 24" style="flex:none" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="var(--allowed)"/><path d="M7.4 12.4l3 3 6.2-6.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
<div class="num" style="font-size:var(--t-xs);color:var(--ink-2);margin-top:3px"><bdi>{{ p.meta }}</bdi></div>
<sc-if value="{{ p.hasNews }}" hint-placeholder-val="{{ false }}">
<div style="display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:3px 8px;border-radius:var(--r-pill);background:var(--allowed-bg);color:var(--allowed-ink);font-size:var(--t-micro);font-weight:500">{{ p.news }}</div>
</sc-if>
</div>
<button type="button" aria-label="{{ t.remove }}" style="flex:none;width:32px;height:32px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center">
<svg width="17" height="17" viewBox="0 0 24 24" fill="var(--brand)" stroke="var(--brand)" stroke-width="1.9"><path d="M12 20s-7-4.4-7-9.3A4.2 4.2 0 0 1 12 8a4.2 4.2 0 0 1 7 2.7c0 4.9-7 9.3-7 9.3z"/></svg>
</button>
</article>
</sc-for>
</div>
</sc-if>

<!-- ══ TRIPS ══ -->
<sc-if value="{{ isTrips }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:11px">
<sc-for list="{{ trips }}" as="t" hint-placeholder-count="3">
<article class="card" style="padding:13px;display:flex;align-items:center;gap:12px;opacity:{{ t.op }}">
<span aria-hidden="true" style="flex:none;width:42px;height:42px;border-radius:var(--r-sm);background:{{ t.bg }};display:grid;place-items:center;font-size:var(--t-xs);font-weight:600;color:{{ t.fg }}">{{ t.cc }}</span>
<div style="flex:1;min-width:0">
<div style="display:flex;align-items:baseline;gap:7px">
<span style="font-size:var(--t-h3);font-weight:500">{{ t.dest }}</span>
<span class="num" style="font-size:var(--t-xs);color:var(--ink-3)"><bdi>{{ t.dates }}</bdi></span>
</div>
<div class="num" style="font-size:var(--t-xs);color:var(--ink-2);margin-top:3px"><bdi>{{ t.who }}</bdi></div>
<div style="margin-top:6px"><span class="chip {{ t.chip }}" style="height:19px;font-size:var(--t-micro)">{{ t.state }}</span></div>
</div>
<sc-if value="{{ t.expired }}" hint-placeholder-val="{{ false }}">
<button type="button" style="flex:none;height:32px;padding:0 12px;border:1px solid var(--rule-strong);border-radius:var(--r-sm);background:var(--surface);color:inherit;font-size:var(--t-sm);cursor:pointer">{{ t.drop }}</button>
</sc-if>
</article>
</sc-for>
</div>
</sc-if>

<!-- ══ EMPTY ══ -->
<sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
<div style="padding:44px 16px;text-align:center">
<span aria-hidden="true" style="display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--neutral-bg);color:var(--ink-3);margin-bottom:15px">
<svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20s-7-4.4-7-9.3A4.2 4.2 0 0 1 12 8a4.2 4.2 0 0 1 7 2.7c0 4.9-7 9.3-7 9.3z"/></svg>
</span>
<h2 style="margin:0 0 8px;font-size:var(--t-h2);font-weight:600">{{ t.emptyTitle }}</h2>
<p style="margin:0 0 18px;font-size:var(--t-body);line-height:1.7;color:var(--ink-2)">{{ t.emptyLede }}</p>
<button type="button" style="height:48px;padding:0 22px;border:0;border-radius:var(--r);background:var(--brand);color:var(--ink-on);font-size:15px;font-weight:600;cursor:pointer">{{ t.browse }}</button>
</div>
</sc-if>

</main>

<div class="scrollx" style="display:flex;gap:6px;padding:9px 14px;background:var(--surface-2);border-top:1px solid var(--rule-faint)">
<sc-for list="{{ views }}" as="v" hint-placeholder-count="2">
<button type="button" onClick="{{ v.pick }}" aria-pressed="{{ v.on }}" style="flex:none;height:27px;padding:0 10px;border:1px solid {{ v.bd }};border-radius:var(--r-pill);background:{{ v.bg }};color:{{ v.fg }};font-size:var(--t-micro);cursor:pointer">{{ v.label }}</button>
</sc-for>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:900}}">
class Component extends DCLogic {
  /* Locale is browser-detected. French is the fallback — Algeria's commercial
     lingua franca and the neutral middle between Arabic and English. One value. */
  static FALLBACK = 'fr';
  static detect() {
    const tag = (typeof navigator !== 'undefined' && (navigator.language || '')).slice(0, 2).toLowerCase();
    return ['ar', 'fr', 'en'].includes(tag) ? tag : Component.FALLBACK;
  }

  state = { tab: 'prod', view: 'full', lang: Component.detect() };
  root = React.createRef();
  componentDidMount() { this._apply(); }
  componentDidUpdate() { this._apply(); }
  _apply() {
    const el = this.root.current;
    if (el) { el.setAttribute('dir', this.L[this.state.lang].dir); el.setAttribute('lang', this.state.lang); }
  }

  fmt(n, sep) { return '⁦' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, sep) + '⁩'; }
  iso(s) { return '⁦' + s + '⁩'; }

  L = {
    ar: {
      dir: 'rtl', short: 'ع', langLabel: 'اللغة', sep: ' ', cur: 'دج',
      title: 'المحفوظات', kind: 'النوع',
      tabs: ['منتجات', 'متاجر', 'رحلات'],
      views: ['فيه محفوظات', 'فارغ'],
      unsave: 'إزالة من المحفوظات', remove: 'إزالة', drop: 'أزل',
      emptyTitle: 'ما عندك والو محفوظ',
      emptyLede: 'اضغط القلب على أي منتج أو متجر باش ترجع له بسهولة، ونعلمك إذا تغيّر سعره أو خلص.',
      browse: 'تصفّح السوق',
      products: [
        { title: 'معطف نسائي شتوي — صوف مخلوط', seller: 'بوتيك نادية', note: 'نزل السعر 500 دج' },
        { title: 'حقيبة يد جلدية بحزام كتف', seller: 'دار الأناقة' },
        { title: 'عطر نسائي 100 مل — شرقي', seller: 'بوتيك نادية', note: 'بقيت 3 وحدات' },
        { title: 'حذاء رياضي رجالي', seller: 'محل ياسين', goneLabel: 'لم يعد متوفراً' }
      ],
      people: [
        { name: 'بوتيك نادية', initials: 'ب ن', meta: 'قسنطينة · 63 معاملة مؤكَّدة', news: 'أضافت 4 منتجات' },
        { name: 'كريمة ح.', initials: 'ك ح', meta: 'مستوردة · 84 معاملة مؤكَّدة', news: 'رحلة جديدة إلى إسطنبول' },
        { name: 'محل ياسين', initials: 'م ي', meta: 'سطيف · 241 معاملة مؤكَّدة' }
      ],
      trips: [
        { dest: 'إسطنبول', dates: '12 – 16 أكتوبر', who: 'كريمة ح.', state: 'مفتوحة للطلب' },
        { dest: 'دبي', dates: '2 – 6 سبتمبر', who: 'سفيان ب.', state: 'انتهت' }
      ]
    },

    fr: {
      dir: 'ltr', short: 'FR', langLabel: 'Langue', sep: ' ', cur: 'DA',
      title: 'Enregistrements', kind: 'Type',
      tabs: ['Produits', 'Boutiques', 'Voyages'],
      views: ['Avec contenu', 'Vide'],
      unsave: 'Retirer des enregistrements', remove: 'Retirer', drop: 'Retirer',
      emptyTitle: 'Rien d’enregistré pour l’instant',
      emptyLede: 'Touchez le cœur sur un produit ou une boutique pour le retrouver facilement — nous vous prévenons si le prix change ou si le stock s’épuise.',
      browse: 'Parcourir la place',
      products: [
        { title: 'Manteau femme hiver — laine mélangée', seller: 'Boutique Nadia', note: 'Prix baissé de 500 DA' },
        { title: 'Sac à main cuir avec bandoulière', seller: 'Dar El Anaqa' },
        { title: 'Parfum femme 100 ml — oriental', seller: 'Boutique Nadia', note: 'Il reste 3 unités' },
        { title: 'Basket homme', seller: 'Chez Yacine', goneLabel: 'Plus disponible' }
      ],
      people: [
        { name: 'Boutique Nadia', initials: 'BN', meta: 'Constantine · 63 transactions confirmées', news: 'A ajouté 4 produits' },
        { name: 'Karima H.', initials: 'KH', meta: 'Importatrice · 84 transactions confirmées', news: 'Nouveau voyage vers Istanbul' },
        { name: 'Chez Yacine', initials: 'CY', meta: 'Sétif · 241 transactions confirmées' }
      ],
      trips: [
        { dest: 'Istanbul', dates: '12 – 16 octobre', who: 'Karima H.', state: 'Ouvert aux demandes' },
        { dest: 'Dubaï', dates: '2 – 6 septembre', who: 'Sofiane B.', state: 'Terminé' }
      ]
    },

    en: {
      dir: 'ltr', short: 'EN', langLabel: 'Language', sep: ',', cur: 'DA',
      title: 'Saved', kind: 'Type',
      tabs: ['Products', 'Shops', 'Trips'],
      views: ['With items', 'Empty'],
      unsave: 'Remove from saved', remove: 'Remove', drop: 'Remove',
      emptyTitle: 'Nothing saved yet',
      emptyLede: 'Tap the heart on any product or shop to come back to it easily — we’ll tell you if the price changes or the stock runs out.',
      browse: 'Browse the marketplace',
      products: [
        { title: 'Women’s winter coat — wool blend', seller: 'Boutique Nadia', note: 'Price dropped by 500 DA' },
        { title: 'Leather handbag with shoulder strap', seller: 'Dar El Anaqa' },
        { title: 'Women’s perfume 100 ml — oriental', seller: 'Boutique Nadia', note: '3 units left' },
        { title: 'Men’s trainers', seller: 'Chez Yacine', goneLabel: 'No longer available' }
      ],
      people: [
        { name: 'Boutique Nadia', initials: 'BN', meta: 'Constantine · 63 confirmed transactions', news: 'Added 4 products' },
        { name: 'Karima H.', initials: 'KH', meta: 'Importer · 84 confirmed transactions', news: 'New trip to Istanbul' },
        { name: 'Chez Yacine', initials: 'CY', meta: 'Sétif · 241 confirmed transactions' }
      ],
      trips: [
        { dest: 'Istanbul', dates: '12 – 16 October', who: 'Karima H.', state: 'Open to requests' },
        { dest: 'Dubai', dates: '2 – 6 September', who: 'Sofiane B.', state: 'Ended' }
      ]
    }
  };

  TAB_IDS = ['prod', 'people', 'trip'];
  TAB_N   = [4, 3, 2];

  // Retention primitives, not a social feed: save, and be told when
  // something you saved changes.
  PRODUCTS = [
    { ph: 'ph-coat', price: 6900, was: 7400, dropped: true, kind: 'good' },
    { ph: 'ph-bag', price: 5900 },
    { ph: 'ph-perfume', price: 4200, kind: 'warn' },
    { ph: 'ph-shoe', price: 6300, gone: true }
  ];

  PEOPLE_TONE = [0, 2, 1];
  TRIPS_META  = [{ cc: 'TR', chip: 'chip-verified', tone: 2 }, { cc: 'AE', chip: 'chip-neutral', tone: 0, expired: true }];

  TONE = [
    ['var(--role-importer-bg)', 'var(--role-importer-ink)'],
    ['var(--role-trader-bg)', 'var(--role-trader-ink)'],
    ['var(--role-consumer-bg)', 'var(--role-consumer-ink)']
  ];

  renderVals() {
    const s = this.state, t = this.L[s.lang], empty = s.view === 'empty';
    const money = n => this.fmt(n, t.sep) + ' ' + t.cur;

    return {
      rootRef: this.root,
      t,

      langs: ['ar', 'fr', 'en'].map(id => ({
        short: this.L[id].short, on: s.lang === id,
        bg: s.lang === id ? 'var(--ink)' : 'var(--surface)',
        fg: s.lang === id ? 'var(--ink-on)' : 'var(--ink-2)',
        pick: () => this.setState({ lang: id })
      })),

      tabs: this.TAB_IDS.map((id, i) => ({
        label: t.tabs[i], n: this.fmt(empty ? 0 : this.TAB_N[i], t.sep), on: s.tab === id,
        bd: s.tab === id ? 'var(--ink)' : 'transparent',
        fg: s.tab === id ? 'var(--ink)' : 'var(--ink-3)',
        fw: s.tab === id ? 600 : 400,
        pick: () => this.setState({ tab: id })
      })),

      views: ['full', 'empty'].map((id, i) => ({
        label: t.views[i], on: s.view === id,
        bd: s.view === id ? 'var(--ink)' : 'var(--rule-strong)',
        bg: s.view === id ? 'var(--ink)' : 'var(--surface)',
        fg: s.view === id ? 'var(--ink-on)' : 'var(--ink-2)',
        pick: () => this.setState({ view: id })
      })),

      isEmpty: empty,
      isProd: !empty && s.tab === 'prod',
      isPeople: !empty && s.tab === 'people',
      isTrips: !empty && s.tab === 'trip',

      products: this.PRODUCTS.map((p, i) => {
        const c = t.products[i];
        return {
          ph: p.ph, title: c.title, seller: c.seller, note: c.note || '', goneLabel: c.goneLabel || '',
          price: money(p.price),
          was: p.was ? money(p.was) : '',
          op: p.gone ? 0.75 : 1,
          priceFg: p.gone ? 'var(--ink-3)' : p.dropped ? 'var(--allowed-ink)' : 'var(--ink)',
          hasNote: !!c.note,
          noteFg: p.kind === 'good' ? 'var(--allowed-ink)' : 'var(--conditional-ink)',
          dropped: !!p.dropped, gone: !!p.gone
        };
      }),

      people: t.people.map((p, i) => {
        const [avBg, avFg] = this.TONE[this.PEOPLE_TONE[i]];
        return { name: p.name, initials: p.initials, meta: this.iso(p.meta), news: p.news || '', hasNews: !!p.news, avBg, avFg };
      }),

      trips: t.trips.map((x, i) => {
        const m = this.TRIPS_META[i];
        const [bg, fg] = this.TONE[m.tone];
        return {
          cc: m.cc, chip: m.chip, dest: x.dest, dates: this.iso(x.dates), who: this.iso(x.who), state: x.state,
          bg, fg, op: m.expired ? 0.7 : 1, expired: !!m.expired
        };
      })
    };
  }
}
</script>
</body>
</html>
