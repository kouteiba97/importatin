<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./tokens.css">
<style>
.scrollx{overflow-x:auto;scrollbar-width:none}
.scrollx::-webkit-scrollbar{display:none}
.meter{height:6px;border-radius:3px;background:var(--neutral-bg);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:3px}
</style>
</helmet>

<div ref="{{ rootRef }}" dir="rtl" lang="ar" class="tier-op" style="min-height:100vh;display:flex;justify-content:center">
<div style="width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);border-inline:1px solid var(--rule)">

<header style="position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--rule)">
<div style="display:flex;align-items:center;gap:10px;padding:11px 16px 9px">
<span style="font-weight:600;font-size:18px">{{ t.title }}</span>
<div style="flex:1"></div>
<span class="num" style="font-size:var(--t-xs);color:var(--ink-3)"><bdi>{{ scopeNote }}</bdi></span>
<div role="group" aria-label="{{ t.langLabel }}" style="display:flex;border:1px solid var(--rule-strong);border-radius:var(--r-sm);overflow:hidden;flex:none">
<sc-for list="{{ langs }}" as="l" hint-placeholder-count="3">
<button type="button" onClick="{{ l.pick }}" aria-pressed="{{ l.on }}" style="height:24px;padding:0 8px;border:0;background:{{ l.bg }};color:{{ l.fg }};font-size:var(--t-micro);font-weight:500;cursor:pointer">{{ l.short }}</button>
</sc-for>
</div>
</div>
<div style="padding:0 16px 10px">
<div style="display:flex;align-items:center;gap:9px;height:40px;padding:0 12px;border:1px solid var(--rule-strong);border-radius:var(--r);background:var(--surface-2)">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="2" style="flex:none"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
<input value="{{ q }}" onChange="{{ onQ }}" placeholder="{{ placeholder }}" aria-label="{{ t.search }}" style="flex:1;min-width:0;border:0;background:transparent;font-size:var(--t-body);color:inherit;outline:none">
</div>
</div>
<nav aria-label="{{ t.sections }}" style="display:grid;grid-template-columns:repeat(3,1fr)">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{ t.pick }}" aria-current="{{ t.on }}" style="height:42px;border:0;border-bottom:2px solid {{ t.bd }};background:transparent;color:{{ t.fg }};font-size:var(--t-body);font-weight:{{ t.fw }};cursor:pointer">{{ t.label }}</button>
</sc-for>
</nav>
</header>

<div class="scrollx" style="display:flex;gap:7px;padding:12px 16px;border-bottom:1px solid var(--rule-faint)">
<sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
<button type="button" onClick="{{ c.pick }}" aria-pressed="{{ c.on }}" style="flex:none;height:32px;padding:0 12px;border:1px solid {{ c.bd }};border-radius:var(--r-pill);background:{{ c.bg }};color:{{ c.fg }};font-size:var(--t-sm);cursor:pointer">{{ c.label }}</button>
</sc-for>
</div>

<main style="flex:1;padding:14px 16px 84px;display:flex;flex-direction:column;gap:12px">

<!-- ══ TRIPS ══ -->
<sc-if value="{{ isTrips }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;gap:12px">
<sc-for list="{{ trips }}" as="t" hint-placeholder-count="3">
<article class="card" style="padding:14px">

<div style="display:flex;align-items:flex-start;gap:11px;margin-bottom:11px">
<span aria-hidden="true" style="flex:none;width:44px;height:44px;border-radius:var(--r-sm);background:{{ t.ccBg }};display:grid;place-items:center;font-size:var(--t-sm);font-weight:600;color:{{ t.ccFg }}">{{ t.cc }}</span>
<div style="flex:1;min-width:0">
<div style="display:flex;align-items:baseline;gap:8px">
<span style="font-size:var(--t-h2);font-weight:500">{{ t.dest }}</span>
<span class="chip {{ t.stateChip }}" style="height:20px;font-size:var(--t-micro)">{{ t.state }}</span>
</div>
<div class="num" style="font-size:var(--t-sm);color:var(--ink-2);margin-top:3px"><bdi>{{ t.datesLine }}</bdi></div>
</div>
</div>

<div style="font-size:var(--t-sm);color:var(--ink-2);margin-bottom:11px">{{ t.catsLine }}</div>

<!-- Capacity: only what the trader legitimately needs. Value headroom is
     the importer's private figure and is never exposed here. -->
<div style="padding:11px 0;border-block:1px solid var(--rule-faint);display:flex;flex-direction:column;gap:9px">
<div style="display:flex;justify-content:space-between;align-items:baseline">
<span style="font-size:var(--t-xs);color:var(--ink-3)">{{ capTitle }}</span>
<span class="num" style="font-size:var(--t-xs);color:var(--ink-3)"><bdi>{{ t.capNote }}</bdi></span>
</div>
<sc-for list="{{ t.meters }}" as="m" hint-placeholder-count="2">
<div>
<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
<span style="font-size:var(--t-xs);color:var(--ink-2)">{{ m.label }}</span>
<span class="num" style="font-size:var(--t-xs);font-weight:500"><bdi>{{ m.text }}</bdi></span>
</div>
<div class="meter"><i style="width:{{ m.pct }}%;background:{{ m.fg }}"></i></div>
</div>
</sc-for>
</div>

<button type="button" style="width:100%;display:flex;align-items:center;gap:10px;padding:11px 0;border:0;border-bottom:1px solid var(--rule-faint);background:transparent;color:inherit;text-align:start;cursor:pointer">
<span aria-hidden="true" style="flex:none;width:30px;height:30px;border-radius:50%;background:{{ t.avBg }};display:grid;place-items:center;font-size:11px;font-weight:600;color:{{ t.avFg }}">{{ t.initials }}</span>
<span style="flex:1;min-width:0">
<span style="display:flex;align-items:center;gap:5px">
<span style="font-size:var(--t-sm);font-weight:500">{{ t.who }}</span>
<svg width="13" height="13" viewBox="0 0 24 24" style="flex:none" role="img" aria-label="{{ verifiedImporter }}"><circle cx="12" cy="12" r="10" fill="var(--allowed)"/><path d="M7.4 12.4l3 3 6.2-6.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</span>
<span class="num" style="display:block;font-size:var(--t-micro);color:var(--ink-2);margin-top:2px"><bdi>{{ t.whoMeta }}</bdi></span>
</span>
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="2" style="flex:none;transform:scaleX({{ arrow }})"><path d="M15 5l-7 7 7 7"/></svg>
</button>

<div style="display:flex;gap:8px;margin-top:12px">
<button type="button" style="flex:1;height:42px;border:0;border-radius:var(--r-sm);background:var(--brand);color:var(--ink-on);font-size:var(--t-sm);font-weight:500;cursor:pointer">{{ requestOffer }}</button>
<button type="button" onClick="{{ t.follow }}" aria-pressed="{{ t.followed }}" aria-label="{{ t.followLabel }}" style="flex:none;width:42px;height:42px;border:1px solid var(--rule-strong);border-radius:var(--r-sm);background:var(--surface);display:grid;place-items:center;cursor:pointer">
<svg width="17" height="17" viewBox="0 0 24 24" fill="{{ t.bellFill }}" stroke="{{ t.bellStroke }}" stroke-width="1.8"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10.5 19.5a2 2 0 0 0 3 0" fill="none"/></svg>
</button>
</div>
</article>
</sc-for>

</div>
</sc-if>

<!-- ══ IMPORTERS ══ -->
<sc-if value="{{ isImporters }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:12px">
<sc-for list="{{ importers }}" as="im" hint-placeholder-count="3">
<article class="card" style="padding:14px">
<div style="display:flex;align-items:flex-start;gap:11px">
<span aria-hidden="true" style="flex:none;width:48px;height:48px;border-radius:50%;background:{{ im.avBg }};display:grid;place-items:center;font-size:var(--t-sm);font-weight:600;color:{{ im.avFg }}">{{ im.initials }}</span>
<div style="flex:1;min-width:0">
<div style="display:flex;align-items:center;gap:6px">
<span style="font-size:var(--t-h3);font-weight:500">{{ im.name }}</span>
<svg width="14" height="14" viewBox="0 0 24 24" style="flex:none" role="img" aria-label="{{ verified }}"><circle cx="12" cy="12" r="10" fill="var(--allowed)"/><path d="M7.4 12.4l3 3 6.2-6.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
<div style="font-size:var(--t-xs);color:var(--ink-2);margin-top:3px">{{ im.level }}</div>
<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:7px">
<sc-for list="{{ im.cats }}" as="c" hint-placeholder-count="3">
<span class="chip chip-neutral" style="height:20px;font-size:var(--t-micro)">{{ c }}</span>
</sc-for>
</div>
</div>
</div>

<!-- Evidence, not a score. Every figure is countable. -->
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin:12px 0 0;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r-sm);overflow:hidden">
<sc-for list="{{ im.stats }}" as="s" hint-placeholder-count="4">
<div style="background:var(--surface);padding:9px 4px;text-align:center">
<div class="num" style="font-size:15px;font-weight:600;line-height:1.25;color:{{ s.fg }}"><bdi>{{ s.v }}</bdi></div>
<div style="font-size:9.5px;color:var(--ink-2);margin-top:2px;line-height:1.3">{{ s.k }}</div>
</div>
</sc-for>
</div>

<div style="display:flex;align-items:center;gap:7px;margin-top:11px;padding-top:11px;border-top:1px solid var(--rule-faint)">
<span class="num" style="flex:1;font-size:var(--t-xs);color:var(--ink-2)"><bdi>{{ im.next }}</bdi></span>
<button type="button" style="height:36px;padding:0 14px;border:1px solid var(--rule-strong);border-radius:var(--r-sm);background:var(--surface);color:inherit;font-size:var(--t-sm);cursor:pointer">{{ profile }}</button>
<button type="button" style="height:36px;padding:0 14px;border:0;border-radius:var(--r-sm);background:var(--ink);color:var(--ink-on);font-size:var(--t-sm);cursor:pointer">{{ message }}</button>
</div>
</article>
</sc-for>

</div>
</sc-if>

<!-- ══ PRODUCTS → hands off to Marketplace ══ -->
<sc-if value="{{ isProducts }}" hint-placeholder-val="{{ false }}">
<div style="padding:34px 16px;text-align:center">
<p style="margin:0 0 14px;font-size:var(--t-body);color:var(--ink-2);line-height:1.7">{{ productsLede }}</p>
<button type="button" style="height:46px;padding:0 22px;border:0;border-radius:var(--r);background:var(--brand);color:var(--ink-on);font-size:var(--t-body);font-weight:500;cursor:pointer">{{ openMarket }}</button>
</div>
</sc-if>

</main>

<nav aria-label="{{ navLabel }}" style="position:fixed;inset-block-end:0;inset-inline:0;margin:0 auto;max-width:430px;display:grid;grid-template-columns:repeat(6,1fr);background:var(--surface);border-top:1px solid var(--rule);padding-block:6px 8px">
<sc-for list="{{ nav }}" as="n" hint-placeholder-count="6">
<button type="button" aria-current="{{ n.on }}" style="display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;padding:4px 0;cursor:pointer;color:{{ n.fg }}">
<span aria-hidden="true" style="width:20px;height:20px;display:grid;place-items:center">{{ n.icon }}</span>
<span style="font-size:9.5px;font-weight:{{ n.fw }}">{{ n.label }}</span>
</button>
</sc-for>
</nav>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:1420}}">
class Component extends DCLogic {
  /* Locale is browser-detected. French is the fallback — Algeria's commercial
     lingua franca and the neutral middle between Arabic and English. One value. */
  static FALLBACK = 'fr';
  static detect() {
    const tag = (typeof navigator !== 'undefined' && (navigator.language || '')).slice(0, 2).toLowerCase();
    return ['ar', 'fr', 'en'].includes(tag) ? tag : Component.FALLBACK;
  }

  state = { tab: 'trips', chip: 'all', followed: { t2: true }, lang: Component.detect() };
  root = React.createRef();
  componentDidMount() { this._apply(); }
  componentDidUpdate() { this._apply(); }
  _apply() {
    const el = this.root.current;
    if (el) { el.setAttribute('dir', this.L[this.state.lang].dir); el.setAttribute('lang', this.state.lang); }
  }

  /* Text runs take a first-strong isolate so Arabic stays RTL and Latin stays LTR;
     inside Arabic, each digit group is pinned LTR so "4 800" never reads "800 4". */
  iso(s) { if (/[\u0600-\u06FF]/.test(s)) s = s.replace(/\d[\d ,.:]*\d%?|\d%?/g, m => '\u2066' + m + '\u2069'); return '\u2068' + s + '\u2069'; }
  fmt(n, sep) { return '⁦' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, sep === undefined ? ' ' : sep) + '⁩'; }
  /* Arabic counts nouns in four forms (one / two / 3–10 / 11+); French and English in two.
     f = { one, two, few, many } for Arabic, { one, many } otherwise. */
  count(n, t, f) {
    if (t.dir === 'rtl') {
      const m = n % 100;
      if (n === 1) return f.one;
      if (n === 2) return f.two;
      if (m >= 3 && m <= 10) return this.fmt(n, t.sep) + ' ' + f.few;
      return this.fmt(n, t.sep) + ' ' + f.many;
    }
    return this.fmt(n, t.sep) + ' ' + (n === 1 ? f.one : f.many);
  }
  langsFor(cur) {
    return ['ar', 'fr', 'en'].map(id => ({
      short: this.L[id].short, on: cur === id,
      bg: cur === id ? 'var(--ink)' : 'var(--surface)',
      fg: cur === id ? 'var(--ink-on)' : 'var(--ink-2)',
      pick: () => this.setState({ lang: id })
    }));
  }

  L = {
    ar: {
      dir: 'rtl', short: 'ع', langLabel: 'اللغة', sep: ' ',
      title: 'اكتشف', search: 'بحث', sections: 'أقسام الاكتشاف', navLabel: 'التنقّل',
      tabs: [['رحلات', 'ابحث بأي وجهة في العالم أو بالفئة'], ['مستوردون', 'ابحث بالاسم أو التخصّص'], ['منتجات', 'ابحث في السوق']],
      chips: {
        trips: ['كل الوجهات', 'يغادر هذا الأسبوع', 'سعة واسعة', 'تركيا', 'الإمارات', 'الصين', 'أوروبا', 'آسيا', 'وجهات أخرى'],
        importers: ['الكل', 'ألبسة', 'تجميل', 'أحذية', 'مُتحقَّق حديثاً'],
        products: ['الكل']
      },
      scopeTrips: '9 رحلات منشورة', scopeImporters: '24 مستورداً مُتحقَّقاً',
      arrives: 'يصل', buysUsually: 'يشتري عادةً:',
      capTitle: 'السعة المتاحة المعلنة', capNote: 'يحدّدها المستورد',
      weight: 'الوزن', volume: 'الحجم', kg: 'كغ', m3: 'م³',
      verifiedImporter: 'مستورد مُتحقَّق', verified: 'مُتحقَّق',
      requestOffer: 'اطلب عرضاً لهذه الرحلة', followOn: 'إلغاء التنبيه', followOff: 'نبّهني عند فتح السعة',
      profile: 'الملف', message: 'راسل',
      productsLede: 'تصفّح المنتجات المعروضة من التجّار المُتحقَّقين في السوق.', openMarket: 'افتح السوق',
      trips: [
        { dest: 'إسطنبول', dates: '12–16 أكتوبر', arrival: '18 أكتوبر', state: 'مفتوحة للطلب', cats: 'ألبسة نسائية · حقائب · إكسسوار', who: 'كريمة ح.', initials: 'ك ح', whoMeta: '84 معاملة مؤكَّدة · ترد خلال ساعة' },
        { dest: 'دبي', dates: '19–23 أكتوبر', arrival: '25 أكتوبر', state: 'سعة محدودة', cats: 'عطور · ساعات · إلكترونيات صغيرة', who: 'سفيان ب.', initials: 'س ب', whoMeta: '12 معاملة مؤكَّدة · مستورد جديد' },
        { dest: 'قوانغتشو', dates: '2–7 نوفمبر', arrival: '9 نوفمبر', state: 'مفتوحة للطلب', cats: 'إلكترونيات صغيرة · منسوجات منزلية', who: 'ن. مرابط', initials: 'ن م', whoMeta: '46 معاملة مؤكَّدة · ترد خلال 3 ساعات' }
      ],
      statLabels: ['معاملة مؤكَّدة', 'نسبة الإتمام', 'متوسط الردّ', 'على المنصّة'],
      importers: [
        { name: 'كريمة ح.', initials: 'ك ح', level: 'مستوردة مُتحقَّقة · وثائق سارية حتى جوان 2027', cats: ['ألبسة نسائية', 'حقائب', 'إكسسوار'], stats: ['84', '97%', 'ساعة', '3 سنوات'], next: 'رحلتها القادمة: إسطنبول · 12 أكتوبر' },
        { name: 'ن. مرابط', initials: 'ن م', level: 'مستورد مُتحقَّق · وثائق سارية حتى مارس 2027', cats: ['منسوجات منزلية', 'مفروشات'], stats: ['46', '92%', '3 ساعات', 'سنتان'], next: 'رحلته القادمة: غازي عنتاب · 2 نوفمبر' },

      ],
      nav: ['الرئيسية', 'اكتشف', 'طلباتي', 'التزاماتي', 'الرسائل', 'حسابي']
    },

    fr: {

      title: 'Découvrir', search: 'Recherche', sections: 'Rubriques', navLabel: 'Navigation',
      tabs: [['Voyages', 'Chercher par destination dans le monde ou par catégorie'], ['Importateurs', 'Chercher par nom ou spécialité'], ['Produits', 'Chercher sur la place']],
      chips: {

        products: ['Tout']
      },
      scopeTrips: '9 voyages publiés', scopeImporters: '24 importateurs vérifiés',
      arrives: 'arrivée', buysUsually: 'Achète habituellement :',
      capTitle: 'Capacité disponible annoncée', capNote: 'Fixée par l’importateur',
      weight: 'Poids', volume: 'Volume', kg: 'kg', m3: 'm³',
      verifiedImporter: 'Importateur vérifié', verified: 'Vérifié',
      requestOffer: 'Demander une offre pour ce voyage', followOn: 'Désactiver l’alerte', followOff: 'M’alerter quand la capacité s’ouvre',
      profile: 'Profil', message: 'Écrire',
      productsLede: 'Parcourez les produits proposés par les commerçants vérifiés sur la place.', openMarket: 'Ouvrir la place',
      trips: [
        { dest: 'Istanbul', dates: '12–16 octobre', arrival: '18 octobre', state: 'Ouvert aux demandes', cats: 'Vêtements femme · sacs · accessoires', who: 'Karima H.', initials: 'KH', whoMeta: '84 transactions confirmées · répond en 1 h' },
        { dest: 'Dubaï', dates: '19–23 octobre', arrival: '25 octobre', state: 'Capacité limitée', cats: 'Parfums · montres · petite électronique', who: 'Sofiane B.', initials: 'SB', whoMeta: '12 transactions confirmées · nouvel importateur' },
        { dest: 'Canton', dates: '2–7 novembre', arrival: '9 novembre', state: 'Ouvert aux demandes', cats: 'Petite électronique · linge de maison', who: 'N. Merabet', initials: 'NM', whoMeta: '46 transactions confirmées · répond en 3 h' }
      ],
      statLabels: ['Transactions confirmées', 'Taux d’achèvement', 'Délai de réponse', 'Sur la plateforme'],
      importers: [
        { name: 'Karima H.', initials: 'KH', level: 'Importatrice vérifiée · documents valides jusqu’en juin 2027', cats: ['Vêtements femme', 'Sacs', 'Accessoires'], stats: ['84', '97 %', '1 h', '3 ans'], next: 'Prochain voyage : Istanbul · 12 octobre' },
        { name: 'N. Merabet', initials: 'NM', level: 'Importateur vérifié · documents valides jusqu’en mars 2027', cats: ['Linge de maison', 'Ameublement'], stats: ['46', '92 %', '3 h', '2 ans'], next: 'Prochain voyage : Gaziantep · 2 novembre' },
        { name: 'Sofiane B.', initials: 'SB', level: 'Importateur vérifié · historique court', cats: ['Parfums', 'Montres'], stats: ['12', '100 %', '2 h', '5 mois'], next: 'Prochain voyage : Dubaï · 19 octobre' }
      ],
      nav: ['Accueil', 'Découvrir', 'Demandes', 'Engagements', 'Messages', 'Compte']
    },

    en: {
      dir: 'ltr', short: 'EN', langLabel: 'Language', sep: ',',
      title: 'Discover', search: 'Search', sections: 'Sections', navLabel: 'Navigation',
      tabs: [['Trips', 'Search any destination in the world, or a category'], ['Importers', 'Search by name or speciality'], ['Products', 'Search the marketplace']],
      chips: {
        trips: ['All destinations', 'Leaving this week', 'Plenty of capacity', 'Türkiye', 'UAE', 'China', 'Europe', 'Asia', 'Other destinations'],
        importers: ['All', 'Clothing', 'Beauty', 'Shoes', 'Recently verified'],
        products: ['All']
      },
      scopeTrips: '9 published trips', scopeImporters: '24 verified importers',
      arrives: 'arrives', buysUsually: 'Usually buys:',
      capTitle: 'Declared available capacity', capNote: 'Set by the importer',
      weight: 'Weight', volume: 'Volume', kg: 'kg', m3: 'm³',
      verifiedImporter: 'Verified importer', verified: 'Verified',
      requestOffer: 'Request an offer for this trip', followOn: 'Turn off alert', followOff: 'Alert me when capacity opens',
      profile: 'Profile', message: 'Message',
      productsLede: 'Browse products listed by verified traders on the marketplace.', openMarket: 'Open the marketplace',
      trips: [
        { dest: 'Istanbul', dates: '12–16 October', arrival: '18 October', state: 'Open to requests', cats: 'Women’s clothing · bags · accessories', who: 'Karima H.', initials: 'KH', whoMeta: '84 confirmed transactions · replies within 1 h' },
        { dest: 'Dubai', dates: '19–23 October', arrival: '25 October', state: 'Limited capacity', cats: 'Perfumes · watches · small electronics', who: 'Sofiane B.', initials: 'SB', whoMeta: '12 confirmed transactions · new importer' },
        { dest: 'Guangzhou', dates: '2–7 November', arrival: '9 November', state: 'Open to requests', cats: 'Small electronics · home textiles', who: 'N. Merabet', initials: 'NM', whoMeta: '46 confirmed transactions · replies within 3 h' }
      ],
      statLabels: ['Confirmed transactions', 'Completion rate', 'Response time', 'On the platform'],
      importers: [
        { name: 'Karima H.', initials: 'KH', level: 'Verified importer · documents valid until June 2027', cats: ['Women’s clothing', 'Bags', 'Accessories'], stats: ['84', '97%', '1 h', '3 yrs'], next: 'Next trip: Istanbul · 12 October' },
        { name: 'N. Merabet', initials: 'NM', level: 'Verified importer · documents valid until March 2027', cats: ['Home textiles', 'Furnishings'], stats: ['46', '92%', '3 h', '2 yrs'], next: 'Next trip: Gaziantep · 2 November' },
        { name: 'Sofiane B.', initials: 'SB', level: 'Verified importer · short record', cats: ['Perfumes', 'Watches'], stats: ['12', '100%', '2 h', '5 mo'], next: 'Next trip: Dubai · 19 October' }
      ],
      nav: ['Home', 'Discover', 'Requests', 'Commitments', 'Messages', 'Account']
    }
  };

  TAB_IDS = ['trips', 'importers', 'products'];
  CHIP_IDS = {
    trips: ['all', 'soon', 'cap', 'tr', 'ae', 'cn', 'eu', 'asia', 'other'],
    importers: ['all', 'clothes', 'cosm', 'shoes', 'new'],
    products: ['all']
  };

  TONE = [
    ['var(--role-importer-bg)', 'var(--role-importer-ink)'],
    ['var(--role-trader-bg)', 'var(--role-trader-ink)'],
    ['var(--role-consumer-bg)', 'var(--role-consumer-ink)']
  ];

  // Weight and volume only. The value meter is the importer's legal cap
  // against their own money — never shown to a counterparty.
  TRIPS = [
    { id: 't1', cc: 'TR', stateChip: 'chip-verified', mw: [38, 46], mv: [0.9, 1.2], tone: 2 },
    { id: 't2', cc: 'AE', stateChip: 'chip-conditional', mw: [26, 30], mv: [0.55, 0.6], tone: 0 },
    { id: 't3', cc: 'CN', stateChip: 'chip-verified', mw: [12, 52], mv: [0.3, 1.4], tone: 1 }
  ];

  // Tint only where a figure is notably strong (completion) or thin (tenure).
  IMPORTER_META = [
    { tone: 2, fg: ['', 'var(--allowed-ink)', '', ''] },
    { tone: 1, fg: ['', '', '', ''] },
    { tone: 0, fg: ['', 'var(--allowed-ink)', '', 'var(--conditional-ink)'] }
  ];

  ICON = {
    home: React.createElement('svg', { width: 19, height: 19, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8 }, React.createElement('path', { d: 'M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z' })),
    disc: React.createElement('svg', { width: 19, height: 19, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8 }, React.createElement('circle', { cx: 12, cy: 12, r: 9 }), React.createElement('path', { d: 'M15.5 8.5l-2 5-5 2 2-5z' })),
    req: React.createElement('svg', { width: 19, height: 19, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8 }, React.createElement('path', { d: 'M7 4h10a1 1 0 0 1 1 1v15l-6-3-6 3V5a1 1 0 0 1 1-1z' })),
    cmt: React.createElement('svg', { width: 19, height: 19, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8 }, React.createElement('path', { d: 'M5 12.5l4.5 4.5L19 7' }), React.createElement('path', { d: 'M4 20h16' })),
    msg: React.createElement('svg', { width: 19, height: 19, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8 }, React.createElement('path', { d: 'M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.3-.6L3 21l1.7-5a8.2 8.2 0 0 1-.7-3.4 8.4 8.4 0 0 1 8.5-8.5 8.4 8.4 0 0 1 8.5 8.4z' })),
    me: React.createElement('svg', { width: 19, height: 19, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8 }, React.createElement('circle', { cx: 12, cy: 8.5, r: 3.7 }), React.createElement('path', { d: 'M4.8 20a7.4 7.4 0 0 1 14.4 0' }))
  };
  NAV_IDS = ['home', 'disc', 'req', 'cmt', 'msg', 'me'];

  meter(label, used, cap, unit, d, sep, dec) {
    const pct = Math.min(100, Math.round(used / cap * 100));
    const fg = pct >= 85 ? 'var(--conditional)' : 'var(--allowed)';
    const f = x => d ? '⁦' + x.toFixed(d).replace('.', dec || '.') + '⁩' : this.fmt(x, sep);
    return { label, pct, fg, text: this.iso(f(used) + ' / ' + f(cap) + ' ' + unit) };
  }

  renderVals() {
    const s = this.state, t = this.L[s.lang];
    const ti = this.TAB_IDS.indexOf(s.tab);

    return {
      rootRef: this.root, t, langs: this.langsFor(s.lang),
      arrow: t.dir === 'rtl' ? 1 : -1,

      capTitle: t.capTitle, verifiedImporter: t.verifiedImporter, verified: t.verified,
      requestOffer: t.requestOffer, profile: t.profile, message: t.message,
      productsLede: t.productsLede, openMarket: t.openMarket, navLabel: t.navLabel,

      q: '', onQ: () => {},
      placeholder: t.tabs[ti][1],
      scopeNote: s.tab === 'trips' ? this.iso(t.scopeTrips) : s.tab === 'importers' ? this.iso(t.scopeImporters) : '',
      isTrips: s.tab === 'trips',
      isImporters: s.tab === 'importers',
      isProducts: s.tab === 'products',

      tabs: this.TAB_IDS.map((id, i) => ({
        label: t.tabs[i][0], on: id === s.tab,
        bd: id === s.tab ? 'var(--ink)' : 'transparent',
        fg: id === s.tab ? 'var(--ink)' : 'var(--ink-3)',
        fw: id === s.tab ? 600 : 400,
        pick: () => this.setState({ tab: id, chip: 'all' })
      })),

      chips: this.CHIP_IDS[s.tab].map((id, i) => ({
        label: t.chips[s.tab][i], on: s.chip === id,
        bd: s.chip === id ? 'var(--ink)' : 'var(--rule-strong)',
        bg: s.chip === id ? 'var(--ink)' : 'var(--surface)',
        fg: s.chip === id ? 'var(--ink-on)' : 'var(--ink)',
        pick: () => this.setState({ chip: id })
      })),

      trips: this.TRIPS.map((m, i) => {
        const c = t.trips[i];
        const [bg, fg] = this.TONE[m.tone];
        const on = !!s.followed[m.id];
        return {
          cc: m.cc, stateChip: m.stateChip,
          dest: c.dest, state: c.state, who: c.who, initials: c.initials,
          ccBg: bg, ccFg: fg, avBg: bg, avFg: fg,
          datesLine: this.iso(c.dates + ' · ' + t.arrives + ' ' + c.arrival),
          catsLine: t.buysUsually + ' ' + c.cats,
          capNote: t.capNote,
          whoMeta: this.iso(c.whoMeta),
          meters: [
            this.meter(t.weight, m.mw[0], m.mw[1], t.kg, 0, t.sep, t.dec),
            this.meter(t.volume, m.mv[0], m.mv[1], t.m3, 2, t.sep, t.dec)
          ],
          followed: on,
          followLabel: on ? t.followOn : t.followOff,
          bellFill: on ? 'var(--brand)' : 'none',
          bellStroke: on ? 'var(--brand)' : 'var(--ink-2)',
          follow: () => this.setState(st => {
            const f = { ...st.followed };
            if (f[m.id]) delete f[m.id]; else f[m.id] = true;
            return { followed: f };
          })
        };
      }),

      importers: t.importers.map((im, i) => {
        const meta = this.IMPORTER_META[i];
        const [avBg, avFg] = this.TONE[meta.tone];
        return {
          name: im.name, initials: im.initials, level: im.level, cats: im.cats,
          next: this.iso(im.next), avBg, avFg,
          stats: im.stats.map((v, k) => ({ v: this.iso(v), k: t.statLabels[k], fg: meta.fg[k] || 'var(--ink)' }))
        };
      }),

      nav: this.NAV_IDS.map((id, i) => ({
        label: t.nav[i], on: id === 'disc',
        fg: id === 'disc' ? 'var(--ink)' : 'var(--ink-3)',
        fw: id === 'disc' ? 600 : 400,
        icon: this.ICON[id]
      }))
    };
  }
}
</script>
</body>
</html>
