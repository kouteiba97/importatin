<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maabar — design review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./tokens.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--font)}
  button{font-family:inherit}
  .logo{display:flex;align-items:center;gap:10px;color:var(--brand)}
  .wm{font-family:var(--font-display);font-weight:600;font-size:20px;letter-spacing:-.02em;color:var(--ink)}
  .langs{display:flex;border:1px solid var(--rule-strong);border-radius:var(--r-sm);overflow:hidden}
  .langs button{height:32px;padding:0 12px;border:0;background:var(--surface);color:var(--ink-2);font-size:12px;font-weight:500;cursor:pointer}
  .langs button[aria-pressed="true"]{background:var(--ink);color:var(--ink-on)}

  /* ---------- gallery ---------- */
  #gallery{max-width:1320px;margin:0 auto;padding:34px 32px 60px}
  .ghead{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-bottom:26px;border-bottom:1px solid var(--rule);margin-bottom:30px}
  .ghead h1{margin:0;font-size:15px;font-weight:500;color:var(--ink-2)}
  .grow{flex:1}
  .group{margin-bottom:38px}
  .group h2{margin:0 0 4px;font-size:22px;font-weight:600}
  .group p{margin:0 0 18px;color:var(--ink-2);font-size:14px;line-height:1.6;max-width:80ch}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
  .card-s{border:1px solid var(--rule);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;cursor:pointer;text-align:start;padding:0;color:inherit;transition:box-shadow .16s ease}
  .card-s:hover{box-shadow:var(--e2)}
  .thumb{position:relative;height:180px;overflow:hidden;background:var(--surface-2);border-bottom:1px solid var(--rule-faint)}
  .thumb iframe{position:absolute;top:0;left:0;width:1440px;height:1000px;border:0;transform-origin:top left;pointer-events:none}
  .cap{padding:12px 15px;display:flex;align-items:center;gap:10px}
  .cap b{font-size:14px;font-weight:600}
  .cap span{margin-inline-start:auto;font-size:12px;color:var(--ink-3)}

  /* ---------- viewer ---------- */
  #viewer{display:none;height:100%;flex-direction:column}
  body.viewing #viewer{display:flex}
  body.viewing #gallery{display:none}
  .vbar{flex:none;height:60px;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--rule)}
  .vbar .title{font-size:15px;font-weight:600}
  .vbar .sub{font-size:12px;color:var(--ink-3)}
  .vbtn{height:34px;padding:0 13px;border:1px solid var(--rule-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center}
  .stage{flex:1;overflow:auto;background:oklch(0.93 0.008 264);padding:22px}
  .browser{margin:0 auto;background:var(--surface);border-radius:10px;box-shadow:0 18px 50px oklch(0.24 0.06 257 / .18);overflow:hidden}
  .chrome{height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--surface-3);border-bottom:1px solid var(--rule)}
  .chrome i{width:11px;height:11px;border-radius:50%;background:var(--rule-strong)}
  .url{margin-inline-start:14px;flex:1;max-width:520px;height:24px;border-radius:6px;background:var(--surface);border:1px solid var(--rule);font:12px var(--mono);color:var(--ink-3);display:flex;align-items:center;padding:0 10px}
  .frame{position:relative;overflow:hidden}
  .frame iframe{position:absolute;top:0;left:0;width:1440px;border:0;transform-origin:top left}
</style>
</head>
<body>

<section id="gallery">
  <div class="ghead">
    <div class="logo"><svg width="30" height="30" viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 36V23a8 8 0 0 1 16 0v13"/><path d="M24 23a8 8 0 0 1 16 0v13"/></g></svg><span class="wm">Maabar</span></div>
    <h1 data-t="heading"></h1>
    <div class="grow"></div>
    <div class="langs" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="fr">FR</button><button data-lang="ar">ع</button></div>
  </div>
  <div id="groups"></div>
</section>

<section id="viewer">
  <div class="vbar">
    <button class="vbtn" id="back"></button>
    <div><div class="title" id="vtitle"></div><div class="sub" id="vsub"></div></div>
    <div class="grow"></div>
    <button class="vbtn" id="prev">←</button>
    <button class="vbtn" id="next">→</button>
    <div class="langs" role="group" aria-label="Language"><button data-lang="en">EN</button><button data-lang="fr">FR</button><button data-lang="ar">ع</button></div>
    <a class="vbtn" id="full" target="_blank" rel="noopener"></a>
  </div>
  <div class="stage" id="stage">
    <div class="browser" id="browser">
      <div class="chrome"><i></i><i></i><i></i><div class="url" id="url"></div></div>
      <div class="frame" id="frame"><iframe id="vframe" title="Screen"></iframe></div>
    </div>
  </div>
</section>

<script>
/* Every screen of the Maabar web platform, grouped by who uses it.
   Screens render at a real desktop width (1440px) and are scaled to fit. */
const GROUPS = [
  { id: 'public', h: 1500, screens: [
    ['Landing', 'maabar.dz'], ['For Importers', 'maabar.dz/for-importers'], ['For Traders', 'maabar.dz/for-traders'], ['Sign In', 'maabar.dz/sign-in'], ['Choose Experience', 'maabar.dz/choose'],
    ['Marketplace', 'maabar.dz/marketplace'], ['Search', 'maabar.dz/search'], ['Product Detail', 'maabar.dz/p/coat-wool'],
    ['Seller Profile', 'maabar.dz/shop/boutique-nadia'], ['Consumer Home', 'maabar.dz/home'], ['Saved', 'maabar.dz/saved'], ['Compliance Checker', 'maabar.dz/check'] ] },
  { id: 'importer', h: 1200, screens: [
    ['Importer Setup', 'maabar.dz/import/setup'], ['Verification', 'maabar.dz/import/verification'], ['Verification Status', 'maabar.dz/import/status'],
    ['Importer Home', 'maabar.dz/import'], ['Demand Board', 'maabar.dz/import/demand'], ['Trip', 'maabar.dz/import/trips/T-26-0412'], ['Trip Creation', 'maabar.dz/import/trips/new'],
    ['Messages', 'maabar.dz/import/messages'], ['Records', 'maabar.dz/import/records'] ] },
  { id: 'trader', h: 1200, screens: [
    ['Trader Setup', 'maabar.dz/trade/setup'], ['Trader Home', 'maabar.dz/trade'], ['Discover', 'maabar.dz/trade/discover'], ['Importer Profile', 'maabar.dz/trade/importers/karima-h'],
    ['Sourcing Request', 'maabar.dz/trade/requests/new'], ['Commitment', 'maabar.dz/trade/commitments/CMT-26-0331'], ['Dispute', 'maabar.dz/trade/disputes/new'],
    ['Listing Composer', 'maabar.dz/trade/shop/new'] ] },
  { id: 'admin', h: 900, screens: [['Admin Sign In', 'ops.maabar.dz/login'], ['Admin Console', 'ops.maabar.dz']] },
  { id: 'brand', h: 2000, screens: [['Logo', 'brand'], ['Dashboards', 'deck']] }
];

const T = {
  en: { heading: 'Design review — web platform', back: '← All screens', full: 'Open full page', of: 'of',
        public: ['Marketplace — public website', 'Visitors and shoppers, the two professional doors, one sign-in, the experience selector.'],
        importer: ['Maabar Import', 'Importer setup and verification, then the workspace: trips, demand, records.'],
        trader: ['Maabar Trade', 'Trader setup with person + business verification, then discovery, requests, commitments, shop.'],
        admin: ['Maabar Admin', 'Separate entry with MFA, then the console: queues, evidence, decisions, audit.'],
        brand: ['Brand', 'Logo kit and the three-role overview.'] },
  fr: { heading: 'Revue de conception — plateforme web', back: '← Tous les écrans', full: 'Ouvrir en pleine page', of: 'sur',
        public: ['Place de marché — site public', 'Visiteurs et acheteurs, les deux portes professionnelles, une seule connexion, le sélecteur d’espace.'],
        importer: ['Maabar Import', 'Installation et vérification importateur, puis l’espace : voyages, demande, registres.'],
        trader: ['Maabar Trade', 'Installation commerçant avec vérification personne + activité, puis découverte, demandes, engagements, boutique.'],
        admin: ['Maabar Admin', 'Entrée séparée avec MFA, puis la console : files, preuves, décisions, audit.'],
        brand: ['Marque', 'Kit logo et vue d’ensemble des trois rôles.'] },
  ar: { heading: 'مراجعة التصميم — منصّة ويب', back: 'كل الشاشات →', full: 'افتح الصفحة كاملة', of: 'من',
        public: ['السوق — الموقع العام', 'الزوّار والمشترون، بابا المحترفين، دخول واحد، واختيار الفضاء.'],
        importer: ['مَعْبَر · الاستيراد', 'إعداد المستورد والتحقّق، ثم فضاء العمل: الرحلات، الطلب، السجلّات.'],
        trader: ['مَعْبَر · التجارة', 'إعداد التاجر بتحقّق الشخص والنشاط، ثم الاكتشاف والطلبات والالتزامات والمتجر.'],
        admin: ['مَعْبَر · الإدارة', 'مدخل منفصل بخطوتين، ثم المركز: الطوابير، الأدلّة، القرارات، السجلّ.'],
        brand: ['الهوية', 'دليل الشعار ونظرة على الأدوار الثلاثة.'] }
};

const FLAT = GROUPS.flatMap(g => g.screens.map(([name, url]) => ({ name, url, h: g.h, group: g.id })));
let lang = new URLSearchParams(location.search).get('lang') || 'en';

function fileOf(name) { return name === 'Dashboards' ? './Dashboards.html' : './' + encodeURIComponent(name) + '.dc.html'; }
function srcOf(name) { return fileOf(name) + '?lang=' + lang; }

function renderGallery() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelector('[data-t=heading]').textContent = t.heading;
  const wrap = document.getElementById('groups');
  wrap.innerHTML = '';
  GROUPS.forEach(g => {
    const sec = document.createElement('section'); sec.className = 'group';
    sec.innerHTML = '<h2></h2><p></p><div class="cards"></div>';
    sec.querySelector('h2').textContent = t[g.id][0];
    sec.querySelector('p').textContent = t[g.id][1];
    const cards = sec.querySelector('.cards');
    g.screens.forEach(([name, url]) => {
      const b = document.createElement('button'); b.className = 'card-s';
      b.innerHTML = '<div class="thumb"><iframe loading="lazy" tabindex="-1"></iframe></div><div class="cap"><b></b><span></span></div>';
      b.querySelector('b').textContent = name;
      b.querySelector('span').textContent = url;
      b.querySelector('iframe').src = srcOf(name);
      b.onclick = () => { location.hash = encodeURIComponent(name); };
      cards.appendChild(b);
    });
    wrap.appendChild(sec);
  });
  fitThumbs();
}

function fitThumbs() {
  document.querySelectorAll('.thumb').forEach(th => {
    const k = th.clientWidth / 1440;
    th.querySelector('iframe').style.transform = 'scale(' + k + ')';
  });
}

function openViewer(name) {
  const i = FLAT.findIndex(x => x.name === name);
  if (i < 0) return closeViewer();
  const s = FLAT[i], t = T[lang];
  document.body.classList.add('viewing');
  document.getElementById('vtitle').textContent = s.name;
  document.getElementById('vsub').textContent = t[s.group][0] + ' · ' + (i + 1) + ' ' + t.of + ' ' + FLAT.length;
  document.getElementById('url').textContent = 'https://' + (s.url.includes('.') ? s.url : 'maabar.dz/' + s.url);
  document.getElementById('back').textContent = t.back;
  const full = document.getElementById('full'); full.textContent = t.full; full.href = srcOf(s.name);
  const fr = document.getElementById('vframe');
  if (fr.dataset.src !== srcOf(s.name)) { fr.dataset.src = srcOf(s.name); fr.src = srcOf(s.name); }
  document.getElementById('prev').onclick = () => { location.hash = encodeURIComponent(FLAT[(i - 1 + FLAT.length) % FLAT.length].name); };
  document.getElementById('next').onclick = () => { location.hash = encodeURIComponent(FLAT[(i + 1) % FLAT.length].name); };
  fr.onload = () => fitViewer(s);
  fitViewer(s);
}

function fitViewer(s) {
  const stage = document.getElementById('stage');
  const avail = Math.min(stage.clientWidth - 44, 1440);
  const k = avail / 1440;
  const fr = document.getElementById('vframe');
  let h = s.h;
  try { const d = fr.contentDocument; if (d && d.body) h = Math.max(900, d.documentElement.scrollHeight, d.body.scrollHeight); } catch (e) {}
  fr.style.height = h + 'px';
  fr.style.transform = 'scale(' + k + ')';
  document.getElementById('browser').style.width = avail + 'px';
  document.getElementById('frame').style.height = Math.ceil(h * k) + 'px';
}

function closeViewer() { document.body.classList.remove('viewing'); }

function setLang(l) {
  lang = l;
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  renderGallery();
  const name = decodeURIComponent(location.hash.slice(1));
  if (name) { document.getElementById('vframe').dataset.src = ''; openViewer(name); }
}

document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => setLang(b.dataset.lang));
document.getElementById('back').onclick = () => { history.pushState('', '', location.pathname + location.search); closeViewer(); };
window.addEventListener('hashchange', () => { const n = decodeURIComponent(location.hash.slice(1)); n ? openViewer(n) : closeViewer(); });
window.addEventListener('resize', () => { fitThumbs(); const n = decodeURIComponent(location.hash.slice(1)); if (n) openViewer(n); });
setInterval(() => { const n = decodeURIComponent(location.hash.slice(1)); if (n) { const s = FLAT.find(x => x.name === n); if (s) fitViewer(s); } }, 1500);

setLang(lang);
</script>
</body>
</html>
