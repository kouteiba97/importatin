<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./tokens.css">
<style>
.scrollx{overflow-x:auto;scrollbar-width:none}.scrollx::-webkit-scrollbar{display:none}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sech{display:flex;justify-content:space-between;align-items:baseline;padding:0 16px 10px}
.sech h2{margin:0;font-size:var(--t-h2);font-weight:500}
.more{border:0;background:transparent;font-size:var(--t-sm);color:var(--brand);cursor:pointer;padding:0}
</style>
</helmet>

<div ref="{{ rootRef }}" dir="rtl" lang="ar" class="tier-public" style="min-height:100vh;display:flex;justify-content:center">
<div style="width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--paper-public);border-inline:1px solid var(--rule)">

<header style="position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--rule)">
<div style="display:flex;align-items:center;gap:10px;padding:12px 16px 10px">
<span style="font-family:var(--font-display);font-weight:600;font-size:18px">{{ t.brand }}</span>
<div style="flex:1"></div>
<div role="group" aria-label="{{ t.langLabel }}" style="display:flex;border:1px solid var(--rule-strong);border-radius:var(--r-sm);overflow:hidden;flex:none">
<sc-for list="{{ langs }}" as="l" hint-placeholder-count="3">
<button type="button" onClick="{{ l.pick }}" aria-pressed="{{ l.on }}" style="height:24px;padding:0 8px;border:0;background:{{ l.bg }};color:{{ l.fg }};font-size:var(--t-micro);font-weight:500;cursor:pointer">{{ l.short }}</button>
</sc-for>
</div>
<button type="button" aria-label="{{ t.navMsg }}" style="position:relative;width:36px;height:36px;border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:inherit">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.3-.6L3 21l1.7-5a8.2 8.2 0 0 1-.7-3.4 8.4 8.4 0 0 1 8.5-8.5 8.4 8.4 0 0 1 8.5 8.4z"/></svg>
</button>
</div>
<div style="padding:0 16px 12px">
<button type="button" style="width:100%;display:flex;align-items:center;gap:9px;height:44px;padding:0 13px;border:1px solid var(--rule-strong);border-radius:var(--r);background:var(--surface-2);cursor:pointer;color:var(--ink-3);font-size:15px;text-align:start">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex:none"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
{{ t.searchPh }}
</button>
</div>
</header>

<main style="flex:1;padding:18px 0 82px;display:flex;flex-direction:column;gap:22px">

<!-- ══ CATEGORIES ══ -->
<section>
<div class="sech"><h2>{{ t.cats }}</h2></div>
<div class="scrollx" style="display:flex;gap:10px;padding:0 16px 4px">
<sc-for list="{{ cats }}" as="c" hint-placeholder-count="5">
<button type="button" class="card" style="flex:none;width:98px;overflow:hidden;padding:0;border:0;cursor:pointer;text-align:start;color:inherit">
<span class="img img-tile ph {{ c.ph }}" style="border-radius:0;display:block"></span>
<span style="display:block;padding:8px 9px 10px">
<span style="display:block;font-size:var(--t-sm);font-weight:500">{{ c.label }}</span>
<span class="num" style="display:block;font-size:var(--t-micro);color:var(--ink-3);margin-top:1px"><bdi>{{ c.n }}</bdi></span>
</span>
</button>
</sc-for>
</div>
</section>

<!-- ══ JUST ARRIVED — the reason to come back ══ -->
<section>
<div class="sech">
<h2>{{ t.fresh }}</h2>
<button type="button" class="more">{{ t.all }}</button>
</div>
<div class="scrollx" style="display:flex;gap:12px;padding:0 16px 4px">
<sc-for list="{{ fresh }}" as="p" hint-placeholder-count="4">
<article class="card" style="flex:none;width:142px;overflow:hidden;cursor:pointer">
<div style="position:relative">
<span class="img img-card ph {{ p.ph }}" style="border-radius:0;display:block"></span>
<span style="position:absolute;inset-block-start:8px;inset-inline-start:8px;height:20px;padding:0 8px;display:inline-flex;align-items:center;border-radius:var(--r-pill);background:var(--allowed-bg);color:var(--allowed-ink);font-size:var(--t-micro);font-weight:500">{{ p.when }}</span>
</div>
<span style="display:block;padding:9px 10px 11px">
<span class="clamp2" style="display:-webkit-box;font-size:var(--t-xs);line-height:1.45;height:33px;overflow:hidden">{{ p.title }}</span>
<span class="num" style="display:block;font-size:var(--t-sm);font-weight:600;color:var(--ink);margin-top:5px"><bdi>{{ p.price }}</bdi></span>
</span>
</article>
</sc-for>
</div>
</section>

<!-- ══ TRUSTED SELLERS NEARBY ══ -->
<section>
<div class="sech">
<h2>{{ t.sellers }}</h2>
<span class="num" style="font-size:var(--t-xs);color:var(--ink-3)"><bdi>{{ t.city }}</bdi></span>
</div>
<div style="margin:0 16px" class="card">
<sc-for list="{{ sellers }}" as="s" hint-placeholder-count="3">
<button type="button" style="width:100%;display:flex;align-items:center;gap:11px;padding:12px 13px;border:0;border-bottom:1px solid var(--rule-faint);background:transparent;color:inherit;text-align:start;cursor:pointer">
<span aria-hidden="true" style="flex:none;width:40px;height:40px;border-radius:50%;background:{{ s.avBg }};display:grid;place-items:center;font-size:11px;font-weight:600;color:{{ s.avFg }}">{{ s.initials }}</span>
<span style="flex:1;min-width:0">
<span style="display:flex;align-items:center;gap:6px">
<span style="font-size:var(--t-body);font-weight:500">{{ s.name }}</span>
<svg width="13" height="13" viewBox="0 0 24 24" style="flex:none" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="var(--allowed)"/><path d="M7.4 12.4l3 3 6.2-6.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</span>
<span class="num" style="display:block;font-size:var(--t-micro);color:var(--ink-2);margin-top:3px"><bdi>{{ s.meta }}</bdi></span>
</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="2" style="flex:none;transform:scaleX({{ arrow }})"><path d="M15 5l-7 7 7 7"/></svg>
</button>
</sc-for>
</div>
</section>

<!-- ══ YOUR SAVED — a reason the app remembers you ══ -->
<section>
<div class="sech">
<h2>{{ t.saved }}</h2>
<button type="button" class="more">{{ t.all }}</button>
</div>
<div style="margin:0 16px" class="card" style="margin:0 16px;padding:4px 13px">
<sc-for list="{{ saved }}" as="s" hint-placeholder-count="2">
<div style="display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--rule-faint)">
<span class="img ph {{ s.ph }}" style="flex:none;width:38px;height:46px;border-radius:var(--r-sm);display:block"></span>
<div style="flex:1;min-width:0">
<div style="font-size:var(--t-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ s.title }}</div>
<div style="font-size:var(--t-micro);color:{{ s.fg }};margin-top:3px;font-weight:500">{{ s.note }}</div>
</div>
<span class="num" style="flex:none;font-size:var(--t-sm);font-weight:600;color:var(--ink)"><bdi>{{ s.price }}</bdi></span>
</div>
</sc-for>
</div>
</section>

<!-- ══ HOW BUYING WORKS — one calm explainer, once ══ -->
<section style="margin:0 16px;padding:15px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface)">
<h2 style="margin:0 0 11px;font-size:var(--t-h3);font-weight:600">{{ t.howTitle }}</h2>
<sc-for list="{{ how }}" as="h" hint-placeholder-count="3">
<div style="display:flex;gap:11px;padding:7px 0">
<span aria-hidden="true" style="flex:none;width:21px;height:21px;border-radius:50%;background:var(--neutral-bg);color:var(--ink-2);display:grid;place-items:center;font-size:10px;font-weight:600">{{ h.n }}</span>
<span style="flex:1;font-size:var(--t-sm);line-height:1.65;color:var(--ink-2)">{{ h.t }}</span>
</div>
</sc-for>
</section>

</main>

<nav aria-label="{{ t.navLabel }}" style="position:fixed;inset-block-end:0;inset-inline:0;margin:0 auto;max-width:430px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--rule);padding-block:6px 8px">
<sc-for list="{{ nav }}" as="n" hint-placeholder-count="5">
<button type="button" aria-current="{{ n.on }}" style="display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;padding:5px 0;cursor:pointer;color:{{ n.fg }}">
<span aria-hidden="true" style="width:21px;height:21px;display:grid;place-items:center">{{ n.icon }}</span>
<span style="font-size:var(--t-micro);font-weight:{{ n.fw }}">{{ n.label }}</span>
</button>
</sc-for>
</nav>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:1320}}">
class Component extends DCLogic {
  /* Locale is browser-detected. French is the fallback — Algeria's commercial
     lingua franca and the neutral middle between Arabic and English. One value. */
  static FALLBACK = 'fr';
  static detect() {
    const tag = (typeof navigator !== 'undefined' && (navigator.language || '')).slice(0, 2).toLowerCase();
    return ['ar', 'fr', 'en'].includes(tag) ? tag : Component.FALLBACK;
  }

  state = { lang: Component.detect() };
  root = React.createRef();
  componentDidMount() { this._apply(); }
  componentDidUpdate() { this._apply(); }
  _apply() {
    const el = this.root.current;
    if (el) { el.setAttribute('dir', this.L[this.state.lang].dir); el.setAttribute('lang', this.state.lang); }
  }

  /* Digits stay Western in all three locales; only the group separator changes.
     Every formatted run is isolated so RTL never reverses it. */
  fmt(n, sep) { return '⁦' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, sep) + '⁩'; }
  /* Text runs take a first-strong isolate so Arabic stays RTL and Latin stays LTR;
     inside Arabic, each digit group is pinned LTR so "4 800" never reads "800 4". */
  iso(s) { if (/[\u0600-\u06FF]/.test(s)) s = s.replace(/\d[\d ,.:]*\d%?|\d%?/g, m => '\u2066' + m + '\u2069'); return '\u2068' + s + '\u2069'; }

  L = {
    ar: {
      dir: 'rtl', short: 'ع', langLabel: 'اللغة', sep: ' ', cur: 'دج',
      brand: 'مَعْبَر', searchPh: 'ابحث عن منتج أو متجر',
      cats: 'الفئات', fresh: 'وصل حديثاً', sellers: 'متاجر موثوقة قريبة منك',
      saved: 'محفوظاتك', all: 'الكل ←', city: 'قسنطينة',
      howTitle: 'كيفاش يخدم الشراء هنا',
      navLabel: 'التنقّل', navMsg: 'الرسائل',
      unit: 'منتج',
      catLabels: ['ألبسة', 'تجميل', 'أحذية', 'حقائب', 'منزل'],
      freshTitles: ['معطف نسائي شتوي — صوف مخلوط', 'حقيبة يد جلدية بحزام كتف', 'ساعة يد رجالية ستانلس', 'عطر نسائي 100 مل'],
      freshWhen: ['اليوم', 'اليوم', 'أمس', 'أمس'],
      sellerNames: ['بوتيك نادية', 'دار الأناقة', 'محل ياسين'],
      sellerInitials: ['ب ن', 'د أ', 'م ي'],
      sellerMeta: ['قسنطينة · 63 معاملة مؤكَّدة · ترد خلال ساعتين', 'وهران · 118 معاملة مؤكَّدة', 'سطيف · 241 معاملة مؤكَّدة'],
      savedTitles: ['معطف نسائي شتوي', 'عطر نسائي 100 مل'],
      savedNotes: ['نزل السعر 500 دج', 'بقيت 3 وحدات'],
      how: [
        'تختار المنتج وتشوف سجل البائع قبل ما تتواصل.',
        'تراسل البائع مباشرةً وتتّفقوا على السعر والتسليم.',
        'البيع يتمّ بينك وبين البائع — مَعْبَر ما تبيعش وما تستلمش فلوس.'
      ],
      nav: ['الرئيسية', 'السوق', 'المحفوظات', 'الرسائل', 'حسابي']
    },

    fr: {
      dir: 'ltr', short: 'FR', langLabel: 'Langue', sep: ' ', cur: 'DA',
      brand: 'Maabar', searchPh: 'Chercher un produit ou une boutique',
      cats: 'Catégories', fresh: 'Nouveautés', sellers: 'Boutiques fiables près de chez vous',
      saved: 'Vos enregistrements', all: 'Tout →', city: 'Constantine',
      howTitle: 'Comment l’achat fonctionne ici',
      navLabel: 'Navigation', navMsg: 'Messages',
      unit: 'produits',
      catLabels: ['Vêtements', 'Beauté', 'Chaussures', 'Sacs', 'Maison'],
      freshTitles: ['Manteau femme hiver — laine mélangée', 'Sac à main cuir avec bandoulière', 'Montre homme acier inoxydable', 'Parfum femme 100 ml'],
      freshWhen: ['Aujourd’hui', 'Aujourd’hui', 'Hier', 'Hier'],
      sellerNames: ['Boutique Nadia', 'Dar El Anaqa', 'Chez Yacine'],
      sellerInitials: ['BN', 'DA', 'CY'],
      sellerMeta: ['Constantine · 63 transactions confirmées · répond en 2 h', 'Oran · 118 transactions confirmées', 'Sétif · 241 transactions confirmées'],
      savedTitles: ['Manteau femme hiver', 'Parfum femme 100 ml'],
      savedNotes: ['Prix baissé de 500 DA', 'Il reste 3 unités'],
      how: [
        'Vous choisissez le produit et consultez les antécédents du vendeur avant tout contact.',
        'Vous écrivez directement au vendeur et convenez du prix et de la remise.',
        'La vente se fait entre vous et le vendeur — Maabar ne vend pas et ne reçoit pas d’argent.'
      ],
      nav: ['Accueil', 'Place', 'Enregistrés', 'Messages', 'Compte']
    },

    en: {
      dir: 'ltr', short: 'EN', langLabel: 'Language', sep: ',', cur: 'DA',
      brand: 'Maabar', searchPh: 'Search for a product or a shop',
      cats: 'Categories', fresh: 'Just arrived', sellers: 'Trusted shops near you',
      saved: 'Your saved items', all: 'All →', city: 'Constantine',
      howTitle: 'How buying works here',
      navLabel: 'Navigation', navMsg: 'Messages',
      unit: 'products',
      catLabels: ['Clothing', 'Beauty', 'Shoes', 'Bags', 'Home'],
      freshTitles: ['Women’s winter coat — wool blend', 'Leather handbag with shoulder strap', 'Men’s stainless steel watch', 'Women’s perfume 100 ml'],
      freshWhen: ['Today', 'Today', 'Yesterday', 'Yesterday'],
      sellerNames: ['Boutique Nadia', 'Dar El Anaqa', 'Chez Yacine'],
      sellerInitials: ['BN', 'DA', 'CY'],
      sellerMeta: ['Constantine · 63 confirmed transactions · replies within 2 h', 'Oran · 118 confirmed transactions', 'Sétif · 241 confirmed transactions'],
      savedTitles: ['Women’s winter coat', 'Women’s perfume 100 ml'],
      savedNotes: ['Price dropped by 500 DA', '3 units left'],
      how: [
        'You pick the product and read the seller’s record before making contact.',
        'You message the seller directly and agree the price and the handover.',
        'The sale is between you and the seller — Maabar does not sell and does not hold money.'
      ],
      nav: ['Home', 'Marketplace', 'Saved', 'Messages', 'Account']
    }
  };

  CATS  = [{ ph: 'ph-coat', n: 1240 }, { ph: 'ph-perfume', n: 913 }, { ph: 'ph-shoe', n: 702 }, { ph: 'ph-bag', n: 486 }, { ph: 'ph-home', n: 355 }];
  FRESH = [{ ph: 'ph-coat', price: 7400 }, { ph: 'ph-bag', price: 5900 }, { ph: 'ph-watch', price: 11500 }, { ph: 'ph-perfume', price: 4200 }];
  SAVED = [{ ph: 'ph-coat', price: 6900, good: true }, { ph: 'ph-perfume', price: 4200, good: false }];

  TONE = [
    ['var(--role-importer-bg)', 'var(--role-importer-ink)'],
    ['var(--role-trader-bg)', 'var(--role-trader-ink)'],
    ['var(--role-consumer-bg)', 'var(--role-consumer-ink)']
  ];

  ICON = {
    home: React.createElement('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8 }, React.createElement('path', { d: 'M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z' })),
    shop: React.createElement('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8 }, React.createElement('path', { d: 'M4 8h16l-1.2 11a1 1 0 0 1-1 .9H6.2a1 1 0 0 1-1-.9z' }), React.createElement('path', { d: 'M8.5 8a3.5 3.5 0 0 1 7 0' })),
    heart: React.createElement('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8 }, React.createElement('path', { d: 'M12 20s-7-4.4-7-9.3A4.2 4.2 0 0 1 12 8a4.2 4.2 0 0 1 7 2.7c0 4.9-7 9.3-7 9.3z' })),
    msg: React.createElement('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8 }, React.createElement('path', { d: 'M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.3-.6L3 21l1.7-5a8.2 8.2 0 0 1-.7-3.4 8.4 8.4 0 0 1 8.5-8.5 8.4 8.4 0 0 1 8.5 8.4z' })),
    user: React.createElement('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 1.8 }, React.createElement('circle', { cx: 12, cy: 8.5, r: 3.7 }), React.createElement('path', { d: 'M4.8 20a7.4 7.4 0 0 1 14.4 0' }))
  };

  NAV_ICONS = ['home', 'shop', 'heart', 'msg', 'user'];

  renderVals() {
    const lang = this.state.lang;
    const t = this.L[lang];
    const money = n => this.fmt(n, t.sep) + ' ' + t.cur;

    return {
      rootRef: this.root,
      t,
      arrow: t.dir === 'rtl' ? 1 : -1,

      langs: ['ar', 'fr', 'en'].map(id => ({
        short: this.L[id].short, on: lang === id,
        bg: lang === id ? 'var(--ink)' : 'var(--surface)',
        fg: lang === id ? 'var(--ink-on)' : 'var(--ink-2)',
        pick: () => this.setState({ lang: id })
      })),

      cats: this.CATS.map((c, i) => ({ ph: c.ph, label: t.catLabels[i], n: this.fmt(c.n, t.sep) + ' ' + t.unit })),

      fresh: this.FRESH.map((p, i) => ({ ph: p.ph, title: t.freshTitles[i], when: t.freshWhen[i], price: money(p.price) })),

      sellers: t.sellerNames.map((name, i) => {
        const [avBg, avFg] = this.TONE[i % 3];
        return { name, initials: t.sellerInitials[i], meta: this.iso(t.sellerMeta[i]), avBg, avFg };
      }),

      saved: this.SAVED.map((s, i) => ({
        ph: s.ph, title: t.savedTitles[i], note: t.savedNotes[i], price: money(s.price),
        fg: s.good ? 'var(--allowed-ink)' : 'var(--conditional-ink)'
      })),

      how: t.how.map((x, i) => ({ n: String(i + 1), t: x })),

      nav: t.nav.map((label, i) => ({
        label, on: i === 0,
        fg: i === 0 ? 'var(--ink)' : 'var(--ink-3)',
        fw: i === 0 ? 600 : 400,
        icon: this.ICON[this.NAV_ICONS[i]]
      }))
    };
  }
}
</script>
</body>
</html>
